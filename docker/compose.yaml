# 로컬 동작 확인용 구성: 서버 1대 + 리눅스 에이전트 2대
name: gridelta-e2e

services:
  server:
    build:
      context: ..
      dockerfile: docker/server.Dockerfile
    environment:
      GRIDELTA_DEBUG: "1"
    ports:
      - "127.0.0.1:${GRIDELTA_E2E_PORT:-3900}:3000"

  agent-debian:
    build:
      context: ..
      dockerfile: docker/agent.Dockerfile
    hostname: agent-debian
    environment:
      GRIDELTA_SERVER: http://server:8443
      GRIDELTA_AGENT_ID: e2e-debian
    depends_on: [server]

  agent-alpine:
    build:
      context: ..
      dockerfile: docker/agent.Dockerfile
      args:
        BASE: alpine:3.22
    hostname: agent-alpine
    environment:
      GRIDELTA_SERVER: http://server:8443
      GRIDELTA_AGENT_ID: e2e-alpine
    depends_on: [server]
