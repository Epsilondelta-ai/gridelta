# 로컬 동작 확인용 구성: 서버 1대 + 리눅스 에이전트 2대 (systemd debian, alpine)
# 인증서는 e2e.sh 가 .e2e/certs 에 만든다.
name: gridelta-e2e

services:
  server:
    build:
      context: ..
      dockerfile: docker/server.Dockerfile
    environment:
      GRIDELTA_DEBUG: "1"
      GRIDELTA_GATEWAY_URL: https://server:8443
      GRIDELTA_TLS_CERT: /certs/server.crt
      GRIDELTA_TLS_KEY: /certs/server.key
      GRIDELTA_TLS_SELF_SIGNED: "1"
    volumes:
      - ./.e2e/certs:/certs:ro
    ports:
      - "127.0.0.1:${GRIDELTA_E2E_PORT:-3900}:3000"

  agent-debian:
    build:
      context: ..
      dockerfile: docker/agent.Dockerfile
      target: systemd
    hostname: agent-debian
    # systemd 를 PID 1 로 돌리기 위한 설정
    privileged: true
    cgroup: host
    tmpfs: [/run, /run/lock]
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    depends_on: [server]

  agent-alpine:
    build:
      context: ..
      dockerfile: docker/agent.Dockerfile
      target: plain
    hostname: agent-alpine
    depends_on: [server]
