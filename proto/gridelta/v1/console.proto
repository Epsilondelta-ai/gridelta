syntax = "proto3";

package gridelta.v1;

option go_package = "github.com/Epsilondelta-ai/gridelta/agent/gen/gridelta/v1;grideltav1";

// 웹 ↔ 서버. 브라우저 제약으로 unary 와 서버 스트림만 쓴다.
// AI 대화 자체는 Flue HTTP 라우트(/agents/operator/:id)를 쓴다.
service ConsoleService {
  rpc ListEndpoints(ListEndpointsRequest) returns (ListEndpointsResponse);
  rpc WatchEndpoints(WatchEndpointsRequest) returns (stream EndpointEvent); // 온라인/오프라인 변화

  // 그룹과 그룹에 PC 를 등록하는 토큰
  rpc ListGroups(ListGroupsRequest) returns (ListGroupsResponse);
  rpc CreateGroup(CreateGroupRequest) returns (Group);
  rpc RenameGroup(RenameGroupRequest) returns (RenameGroupResponse);
  rpc DeleteGroup(DeleteGroupRequest) returns (DeleteGroupResponse); // PC 는 기본 그룹으로, 토큰은 폐기
  rpc MoveEndpoint(MoveEndpointRequest) returns (MoveEndpointResponse);
  rpc CreateEnrollToken(CreateEnrollTokenRequest) returns (CreateEnrollTokenResponse);
  rpc ListEnrollTokens(ListEnrollTokensRequest) returns (ListEnrollTokensResponse);
  rpc RevokeEnrollToken(RevokeEnrollTokenRequest) returns (RevokeEnrollTokenResponse);

  // 웹 터미널
  rpc OpenTerminal(OpenTerminalRequest) returns (OpenTerminalResponse); // session_id 발급
  rpc ListTerminals(ListTerminalsRequest) returns (ListTerminalsResponse); // 새로고침 후 탭 복원용
  rpc AttachTerminal(AttachTerminalRequest) returns (stream TerminalOutput); // 출력 스트림, from_seq 로 재접속
  rpc SendInput(SendInputRequest) returns (SendInputResponse);
  rpc ResizeTerminal(ResizeTerminalRequest) returns (ResizeTerminalResponse);
  rpc CloseTerminal(CloseTerminalRequest) returns (CloseTerminalResponse);
  rpc RenameTerminal(RenameTerminalRequest) returns (RenameTerminalResponse);
  rpc RenameEndpoint(RenameEndpointRequest) returns (RenameEndpointResponse);

  // AI 명령 승인
  rpc WatchApprovals(WatchApprovalsRequest) returns (stream ApprovalEvent); // 구독 직후 대기 중인 요청을 보낸다
  rpc DecideApproval(DecideApprovalRequest) returns (DecideApprovalResponse);
  rpc SetApprovalPolicy(SetApprovalPolicyRequest) returns (SetApprovalPolicyResponse);

  // AI 대화 세션. 대화 내용은 Flue 라우트가 저장하고, 여기서는 목록·이름을 관리한다
  rpc ListAiSessions(ListAiSessionsRequest) returns (ListAiSessionsResponse);
  rpc CreateAiSession(CreateAiSessionRequest) returns (AiSession);
  rpc RenameAiSession(RenameAiSessionRequest) returns (RenameAiSessionResponse);
  rpc DeleteAiSession(DeleteAiSessionRequest) returns (DeleteAiSessionResponse);

  // 스케줄 잡 (설계 14장)
  rpc ListJobs(ListJobsRequest) returns (ListJobsResponse);
  rpc GetJob(GetJobRequest) returns (Job);
  rpc CreateJob(CreateJobRequest) returns (Job);
  rpc UpdateJob(UpdateJobRequest) returns (Job);
  rpc DeleteJob(DeleteJobRequest) returns (DeleteJobResponse);
  rpc SetJobEnabled(SetJobEnabledRequest) returns (Job);
  rpc RunJobNow(RunJobNowRequest) returns (JobRun);
  rpc ListJobRuns(ListJobRunsRequest) returns (ListJobRunsResponse);
  rpc GetJobRun(GetJobRunRequest) returns (GetJobRunResponse);

  // PC 상태 기록 (이름 + JSON 값)
  rpc ListLatestRecords(ListLatestRecordsRequest) returns (ListRecordsResponse);
  rpc ListRecords(ListRecordsRequest) returns (ListRecordsResponse);

  // AI 모델 선택. 바꾸면 새 대화부터 적용된다
  rpc GetAiSettings(GetAiSettingsRequest) returns (AiSettings);
  rpc UpdateAiSettings(UpdateAiSettingsRequest) returns (AiSettings);
}

message Endpoint {
  string id = 1;
  string hostname = 2;
  string os = 3;
  string arch = 4;
  string home_dir = 5;
  string default_shell = 6;
  string agent_version = 7;
  bool online = 8;
  int64 last_seen_ms = 9;
  string approval_policy = 10; // always | dangerous | auto
  string display_name = 11; // 사용자가 붙인 이름. 비어 있으면 hostname 을 쓴다
  string group_id = 12;
}

message ListEndpointsRequest {}

message ListEndpointsResponse {
  repeated Endpoint endpoints = 1;
}

message WatchEndpointsRequest {}

message EndpointEvent {
  Endpoint endpoint = 1; // 상태가 바뀐 PC. 구독 직후에는 현재 목록을 한 건씩 보낸다
}

message OpenTerminalRequest {
  string endpoint_id = 1;
  uint32 cols = 2;
  uint32 rows = 3;
}

message OpenTerminalResponse {
  string session_id = 1;
}

message Terminal {
  string session_id = 1;
  string endpoint_id = 2;
  int64 created_at_ms = 3;
  bool exited = 4;
  string title = 5; // 사용자가 붙인 탭 이름. 비어 있으면 클라이언트가 "터미널 N" 으로 보여 준다
}

message ListTerminalsRequest {
  string endpoint_id = 1; // 비우면 전체
}

message ListTerminalsResponse {
  repeated Terminal terminals = 1;
}

message AttachTerminalRequest {
  string session_id = 1;
  uint64 from_seq = 2; // 받은 마지막 seq + 1, 처음은 0
}

message TerminalOutput {
  bytes data = 1;
  uint64 seq = 2;
  bool reset = 3; // true 면 from_seq 이후 일부가 버퍼에서 밀려남 → 클라이언트는 화면을 초기화한 뒤 data 를 씀
  optional int32 exit_code = 4; // 셸 종료 시 마지막 메시지에 담고 스트림 종료
  // true 면 버퍼에서 다시 보내는 지난 출력. 그 안의 터미널 질의(색상·장치 정보 등)에 xterm 이 답하면
  // 그 답이 셸 입력으로 들어가므로, 클라이언트는 재생 출력을 그리는 동안 생긴 응답을 버린다
  bool replay = 5;
}

message SendInputRequest {
  string session_id = 1;
  uint64 input_seq = 2; // client_id 별 0부터 1씩 증가. 이미 처리한 값은 무시한다(재시도 안전)
  bytes data = 3;
  string client_id = 4; // 입력을 보내는 탭마다 새로 만드는 랜덤 id. 새로고침하면 바뀐다
}

message SendInputResponse {}

message ResizeTerminalRequest {
  string session_id = 1;
  uint32 cols = 2;
  uint32 rows = 3;
}

message ResizeTerminalResponse {}

message CloseTerminalRequest {
  string session_id = 1;
}

message CloseTerminalResponse {}

message Approval {
  string id = 1;
  string endpoint_id = 2;
  string hostname = 3;
  string command = 4;
  string status = 5; // pending | approved | denied | expired
  int64 created_at_ms = 6;
  string conversation_id = 7; // 요청한 AI 대화 (Flue 인스턴스 id)
}

message WatchApprovalsRequest {}

message ApprovalEvent {
  Approval approval = 1;
}

message DecideApprovalRequest {
  string id = 1;
  bool approve = 2;
}

message DecideApprovalResponse {}

message SetApprovalPolicyRequest {
  string endpoint_id = 1;
  string policy = 2; // always | dangerous | auto
}

message SetApprovalPolicyResponse {}

message AiModel {
  string id = 1; // provider/model (예: openai-codex/gpt-5.6-sol)
  string name = 2;
}

message AiSettings {
  string model = 1;
  repeated AiModel models = 2; // 고를 수 있는 모델
}

message GetAiSettingsRequest {}

message UpdateAiSettingsRequest {
  string model = 1;
}

message RenameTerminalRequest {
  string session_id = 1;
  string title = 2; // 비우면 기본 이름으로 돌아간다
}

message RenameTerminalResponse {}

message RenameEndpointRequest {
  string endpoint_id = 1;
  string display_name = 2; // 비우면 hostname 으로 돌아간다
}

message RenameEndpointResponse {}

message AiSession {
  string id = 1;
  string scope = 2; // "all" 이면 여러 PC 를 다루는 통합 대화, 아니면 그 PC 의 endpoint id
  string title = 3;
  int64 created_at_ms = 4;
  int64 updated_at_ms = 5;
  string agent_url = 6; // 이 세션의 Flue 대화 URL (/agents/assistant/<id> 또는 /agents/operator/<endpoint>:<id>)
}

message ListAiSessionsRequest {
  string endpoint_id = 1; // 주면 통합 대화 + 그 PC 의 대화, 비우면 전체
}

message ListAiSessionsResponse {
  repeated AiSession sessions = 1; // 최근에 쓴 것부터
}

message CreateAiSessionRequest {
  string scope = 1; // "all" 또는 endpoint id
}

message RenameAiSessionRequest {
  string id = 1;
  string title = 2;
}

message RenameAiSessionResponse {}

message DeleteAiSessionRequest {
  string id = 1;
}

message DeleteAiSessionResponse {}

message Group {
  string id = 1; // "default" 는 지울 수 없는 기본 그룹
  string name = 2;
  uint32 endpoint_count = 3;
}

message ListGroupsRequest {}

message ListGroupsResponse {
  repeated Group groups = 1;
}

message CreateGroupRequest {
  string name = 1;
}

message RenameGroupRequest {
  string id = 1;
  string name = 2;
}

message RenameGroupResponse {}

message DeleteGroupRequest {
  string id = 1;
}

message DeleteGroupResponse {}

message MoveEndpointRequest {
  string endpoint_id = 1;
  string group_id = 2;
}

message MoveEndpointResponse {}

message CreateEnrollTokenRequest {
  string group_id = 1; // 비우면 기본 그룹
  uint32 ttl_seconds = 2; // 0 이면 3600
  uint32 max_uses = 3; // 0 이면 만료 전까지 무제한
}

message CreateEnrollTokenResponse {
  string token = 1; // 원문은 이때만 볼 수 있다
  int64 expires_at_ms = 2;
  string server_url = 3;
  string ca_fingerprint = 4; // 자체 서명 인증서일 때만
  string unix_command = 5; // macOS·Linux 에서 root 로 실행할 등록·설치 명령
  string windows_command = 6; // 관리자 PowerShell 에서 실행할 명령
}

message EnrollToken {
  string id = 1; // 토큰의 해시 (원문은 저장하지 않는다)
  string group_id = 2;
  int64 created_at_ms = 3;
  int64 expires_at_ms = 4;
  uint32 max_uses = 5;
  uint32 uses = 6;
}

message ListEnrollTokensRequest {
  string group_id = 1; // 비우면 전체
}

message ListEnrollTokensResponse {
  repeated EnrollToken tokens = 1; // 아직 쓸 수 있는 것만
}

message RevokeEnrollTokenRequest {
  string id = 1;
}

message RevokeEnrollTokenResponse {}

// 잡을 만들거나 바꿀 때 받는 내용
message JobSpec {
  string name = 1;
  string kind = 2; // command | ai
  string target_type = 3; // endpoint | group
  string target_id = 4;
  string cron = 5; // 5필드 또는 초를 포함한 6필드. 비우면 run_at_ms 에 한 번만
  int64 run_at_ms = 6;
  string timezone = 7; // IANA (예: Asia/Seoul)
  string command_unix = 8; // macOS·Linux
  string command_windows = 9; // Windows (PowerShell)
  string ai_prompt = 10;
  string record_name = 11; // 비우면 출력을 상태로 저장하지 않는다
  string record_parse = 12; // json | kv | text
  uint32 timeout_s = 13; // 0 이면 600
  uint32 concurrency = 14; // 0 이면 10
  bool enabled = 15;
}

message JobRun {
  string id = 1;
  string job_id = 2;
  int64 scheduled_at_ms = 3;
  int64 started_at_ms = 4;
  int64 finished_at_ms = 5; // 실행 중이면 0
  string status = 6; // running | succeeded | failed | skipped
  string note = 7;
  string trigger = 8; // schedule | manual | catchup
  uint32 target_count = 9;
  uint32 ran_count = 10; // 오프라인 PC 는 세지 않는다
}

message Job {
  string id = 1;
  JobSpec spec = 2;
  int64 next_run_at_ms = 3; // 0 이면 예정 없음
  string created_by = 4; // user | ai
  int64 created_at_ms = 5;
  int64 updated_at_ms = 6;
  JobRun last_run = 7;
}

message JobResult {
  string endpoint_id = 1;
  optional int32 exit_code = 2; // 명령이 끝나지 못했으면 없음 (error 참고)
  string error = 3;
  string output = 4; // stdout + stderr, 최대 64 KB
  bool truncated = 5;
  string record_status = 6; // none | saved | failed
  int64 started_at_ms = 7;
  int64 finished_at_ms = 8;
}

message ListJobsRequest {}

message ListJobsResponse {
  repeated Job jobs = 1;
}

message GetJobRequest {
  string id = 1;
}

message CreateJobRequest {
  JobSpec spec = 1;
}

message UpdateJobRequest {
  string id = 1;
  JobSpec spec = 2;
}

message DeleteJobRequest {
  string id = 1;
}

message DeleteJobResponse {}

message SetJobEnabledRequest {
  string id = 1;
  bool enabled = 2;
}

message RunJobNowRequest {
  string id = 1;
}

message ListJobRunsRequest {
  string job_id = 1;
  uint32 limit = 2; // 0 이면 50
}

message ListJobRunsResponse {
  repeated JobRun runs = 1; // 최근 것부터
}

message GetJobRunRequest {
  string run_id = 1;
}

message GetJobRunResponse {
  JobRun run = 1;
  repeated JobResult results = 2;
}

message StateRecord {
  string endpoint_id = 1;
  string name = 2;
  string value_json = 3;
  int64 recorded_at_ms = 4;
  string source = 5; // job:<잡>:<회차> 또는 ai:<세션>
}

message ListLatestRecordsRequest {
  string endpoint_id = 1;
}

message ListRecordsRequest {
  string endpoint_id = 1;
  string name = 2; // 정확히 그 이름이거나 "name." 아래 전부
  int64 since_ms = 3;
  uint32 limit = 4; // 0 이면 200
}

message ListRecordsResponse {
  repeated StateRecord records = 1;
}
